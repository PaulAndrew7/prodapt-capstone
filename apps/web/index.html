<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F6F5" />
    <meta
      name="description"
      content="Your next move, backed by policy. Tell Clause what you're planning and see which rules apply, what needs attention, and the source behind each finding."
    />
    <title>Clause</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Paint the theme's paper from the first byte, so there is no white flash before the stylesheet and the front door's intro. -->
    <style>
      html { background: #f4f6f5; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0e1110; } }
      html[data-theme="dark"] { background: #0e1110; }
    </style>
    <script>
      try {
        var t = localStorage.getItem("clause.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      DIRECTION CONTRACT (Clause, Highlighter)
      THESIS: Every verdict is pinned to the exact words that justify it. Refuses the dark AI dashboard with a score dial and the cream editorial serif workspace.
      OWN-WORLD: Cool paper #F4F6F5, sheets #FBFCFB, ink #111413, one fluorescent mark #DDFF3C used only as a fill behind ink. 2px ink rules, square corners, no shadows; depth from parallax layers. Clash Display for headlines and verdicts, Switzer for the working UI.
      STORY: A pile of policies resolves into one highlighted clause; the real product then shows describe, answer only what matters, verdict, evidence.
      FIRST VIEWPORT: Left, two-line headline "Every verdict, / pinned to its clause." with the mark sweeping "pinned to its clause."; 18-word subtext; "Enter demo" (mark fill) and "See how it works". Right, bleeding off the edge, a Three.js stack of policy sheets; scroll brings clause 4.2 forward and highlights it.
      FORM: Highlighter, user-pinned via structured question on 2026-09-25. No concept-seed roll ran; a user-pinned direction overrides the roll, so there is no seed key.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
