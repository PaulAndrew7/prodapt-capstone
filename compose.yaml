# Local integrated stack (IMPLEMENTATION_PLAN.md §15.3).
# `docker compose up --build` starts Postgres + pgvector and the API.
# The web app runs with `corepack pnpm --dir apps/web dev` and proxies /api to the API.
name: clause

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: clause
      POSTGRES_USER: clause
      POSTGRES_PASSWORD: clause
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clause -d clause"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://clause:clause@db:5432/clause
      STORAGE_DIR: /var/lib/clause/storage
      MODEL_CACHE_DIR: /var/lib/clause/models
    ports:
      - "8000:8000"
    volumes:
      - storage:/var/lib/clause/storage
      - models:/var/lib/clause/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage:
  models:
