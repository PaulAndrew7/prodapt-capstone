name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      DATABASE_URL: postgresql+psycopg://clause:clause@localhost:5433/clause
      EMBEDDINGS_ENABLED: "false"  # no model download in CI; dense retrieval is tested locally
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
      - run: uv sync --frozen
      - name: Start PostgreSQL (installed with the Python dependencies, as on a laptop)
        run: uv run python -m app.cli db-start
      - name: Lint
        run: uv run ruff check app tests ../../scripts && uv run ruff format --check app tests ../../scripts
      - name: Typecheck
        run: uv run mypy app
      - name: Migrations apply to an empty database and match the models
        run: uv run python -m app.cli migrate && uv run alembic check
      - name: OpenAPI contract is up to date
        run: uv run python -m app.cli export-openapi --check
      - name: Demo corpus PDFs are reproducible from source
        run: uv run python ../../scripts/build_demo_corpus.py && git diff --exit-code -- ../../data/demo
      - name: Tests
        run: uv run pytest
      - name: Seed the demo corpus
        run: uv run python -m app.cli seed-demo

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
