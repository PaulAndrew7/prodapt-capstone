[project]
name = "clause-api"
version = "0.1.0"
description = "Clause policy compliance service: FastAPI API, ingestion and workflow worker."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.1",
    "openai>=3.19.2",
    "pgvector>=0.5.0",
    # PostgreSQL + pgvector without Docker. Pinned: the 0.6.0 Windows build of pgvector
    # needs AVX-512 and crashes on CPUs without it (such as AMD Ryzen 5000).
    "pixeltable-pgserver==0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# RUF001: ingestion code matches typographic quotes, dashes and NBSP on purpose.
ignore = ["S101", "B008", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["db: needs the Postgres test database (skipped when unreachable)"]
